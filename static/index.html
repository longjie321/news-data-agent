<!DOCTYPE html>
<!-- ============================================================
     【这个文件干什么】
       智能体的对话页面。打开浏览器就能用：
       输入一个问题 → 看到"它正在调哪个工具" → 看到回答一个字一个字冒出来。

     【怎么打开】
       启动服务（python main.py）后，浏览器访问 http://127.0.0.1:8020
       根路径会直接返回这个页面。

     【为什么只用这一个文件】
       不引入 Vue / React 等前端框架 —— 那些要另外装 node、另外学一套语法。
       这里只用浏览器自带的 HTML + CSS + JavaScript，零安装。

     【⚠️ 一个关键的技术点（看代码时会遇到）】
       后端接口是 POST 请求，而浏览器自带的 EventSource（专门收 SSE 的对象）
       只支持 GET、不能带请求体。所以这里改用 fetch 手动读流。
       这就是下面 JavaScript 里那段"手动解析"存在的原因。
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻数据智能体</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 【整体布局（2026-09-20 改）】
           改之前：整页从上往下排 —— 标题、输入框、消息列表依次往下长。
                   聊几轮之后页面变得很长，想再提问就得把页面滚回顶部，很麻烦。
           改之后：页面本身不滚动，只有中间的消息区自己滚。
                   标题钉在顶部、输入框钉在底部，不管聊多少轮都看得见。
           实现思路（三句话）：
             body     撑满一屏高度，纵向排列，自己不许滚（否则会出现两条滚动条）
             .wrap    纵向排列，flex:1 占满 body 剩下的高度
             #chat    占满 .wrap 中间的空档，内容超出就自己滚
             .composer 不参与压缩，自然被挤到最下面 */
        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #f5f6f8;
            color: #1f2328;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .wrap {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            /* flex: 1      —— 占满 body 剩下的高度
               min-height: 0 —— 没有这一行，flex 子元素的最小高度会等于它的内容高度，
                                里面的 #chat 就撑破了，滚动条也不会出现（这是个经典坑） */
            flex: 1;
            min-height: 0;
        }

        /* ========== 顶部标题 ========== */
        .header {
            padding-top: 20px;
            padding-bottom: 12px;
            /* 和下面的对话区之间画一条淡分隔线 ——
               不加的话，对话区一滚动，内容会紧贴着头部的工具标签，
               看起来像"被切掉了一块" */
            border-bottom: 1px solid #e6e9ec;
            margin-bottom: 12px;
            /* 标题区不参与压缩 —— 永远待在顶部 */
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        .header p {
            color: #656d76;
            font-size: 14px;
            margin-top: 4px;
        }

        /* 可用工具的小标签 */
        .tool-tags {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tool-tag {
            font-size: 12px;
            color: #0f766e;
            background: #e6f4f1;
            border: 1px solid #b8e0d8;
            border-radius: 4px;
            padding: 1px 8px;
        }

        /* ========== 输入区（固定在屏幕底部） ========== */
        .composer {
            background: #ffffff;
            border: 1px solid #d8dee4;
            border-radius: 10px;
            padding: 14px;
            /* flex-shrink: 0 —— 不参与压缩，所以它会被稳稳地挤在页面最下面。
               （想验证效果：故意不加这行，然后把窗口拉矮，输入框会被压扁） */
            flex-shrink: 0;
            margin-bottom: 14px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            font-size: 15px;
            font-family: inherit;
            padding: 10px 12px;
            border: 1px solid #d8dee4;
            border-radius: 8px;
            outline: none;
        }

        #question:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        #sendBtn {
            font-size: 15px;
            font-family: inherit;
            color: #ffffff;
            background: #0f766e;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            cursor: pointer;
        }

        #sendBtn:hover {
            background: #0d6a63;
        }

        /* 请求进行中时，按钮变灰且不可点（防止连点重复请求） */
        #sendBtn:disabled {
            background: #a8b3b1;
            cursor: not-allowed;
        }

        /* 快捷提问按钮 */
        .quick {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick button {
            font-size: 13px;
            font-family: inherit;
            color: #444c56;
            background: #f0f2f4;
            border: 1px solid #d8dee4;
            border-radius: 14px;
            padding: 4px 12px;
            cursor: pointer;
        }

        .quick button:hover {
            background: #e4e8ec;
        }

        /* ========== 对话区（自己滚动的那一块） ========== */
        #chat {
            display: flex;
            flex-direction: column;
            gap: 14px;
            /* ★ 关键的三行：
               flex: 1         —— 占满 .wrap 里 "标题" 和 "输入框" 之间的全部空档
               min-height: 0   —— 允许它被压到比内容还矮（否则不会出现滚动条）
               overflow-y:auto —— 内容超高时，在【这一块内部】滚动，
                                  外面的输入框纹丝不动 */
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 4px 4px 8px;
        }

        /* 用户问的那句话 */
        .user-msg {
            align-self: flex-end;
            max-width: 80%;
            background: #0f766e;
            color: #ffffff;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 15px;
            word-break: break-word;
        }

        /* 智能体的回答卡片 */
        .agent-msg {
            align-self: flex-start;
            width: 100%;
            background: #ffffff;
            border: 1px solid #d8dee4;
            border-radius: 10px;
            padding: 14px;
        }

        /* 工具调用过程的那一小块 */
        .tool-block {
            background: #fffaf0;
            border: 1px solid #f0dcb8;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 13.5px;
            color: #7a5a1e;
        }

        .tool-block .tool-line {
            margin: 2px 0;
        }

        .tool-block .tool-name {
            font-weight: 600;
        }

        .tool-block .tool-result {
            color: #2f6b3f;
        }

        /* 回答正文（一段段往里追加） */
        .answer {
            font-size: 15.5px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 光标闪烁效果：表示"还在输出" */
        .caret {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #0f766e;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 底部状态行：耗时、工具调用次数 */
        .meta {
            margin-top: 8px;
            font-size: 12.5px;
            color: #8c959f;
        }

        /* 出错提示 */
        .err {
            color: #b42318;
            background: #fdf3f2;
            border: 1px solid #f3c9c5;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
        }

        /* 等待第一个字时的提示 */
        .thinking {
            color: #8c959f;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="wrap">

    <!-- ========== 标题区 ========== -->
    <div class="header">
        <h1>新闻数据智能体</h1>
        <p>用大白话提问，模型自己决定去查数据库</p>
        <div class="tool-tags" id="toolTags"></div>
    </div>

    <!-- ========== 对话区 ========== -->
    <!-- 【顺序很重要】对话区写在输入区【前面】。
         因为整页是纵向 flex 排列，谁写在后面谁就在下面 ——
         输入区放最后，所以它固定在屏幕底部。 -->
    <div id="chat"></div>

    <!-- ========== 输入区 ========== -->
    <div class="composer">
        <div class="row">
            <input id="question" type="text" placeholder="例如：体育类有多少篇新闻？" maxlength="500">
            <button id="sendBtn">提问</button>
        </div>
        <div class="quick">
            <button onclick="fillQuestion('体育类有多少篇新闻？')">体育类多少篇</button>
            <button onclick="fillQuestion('浏览量最高的 5 篇新闻是哪些？')">浏览量排行</button>
            <button onclick="fillQuestion('最近一周科技类有多少篇新闻？')">最近一周科技类</button>
            <button onclick="fillQuestion('搜一下关于人工智能的新闻')">关键词搜索</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// 【这一段 JavaScript 干什么】
//   1. 把用户的问题 POST 给 /api/agent/chat
//   2. 手动解析后端一行行推回来的 SSE 报文
//   3. 把"调用工具"和"回答正文"分别渲染到页面上
// ============================================================

// 页面上的几个元素，先取出来存着，后面反复用
var chatBox = document.getElementById("chat");
var inputBox = document.getElementById("question");
var sendBtn = document.getElementById("sendBtn");
var toolTags = document.getElementById("toolTags");

// 多轮对话的历史记录，形如 [{role: "user", content: "..."}, ...]
// 每次提问时把它一起发给后端，模型才知道上下文
//
// ⚠️⚠️ 这个变量千万不能叫 history ！！！（这是一个真实的坑，我踩过）
//   因为浏览器 window 上天生就有一个 history 属性（就是浏览器自己那个
//   "前进/后退历史"对象），而且它是【只读】的。
//   在全局作用域写 var history = []，这句赋值会被浏览器【静默忽略】——
//   history 仍然指向那个 History 对象，不是你的数组。
//   后果：JSON.stringify 一个 History 对象会得到 {}，
//         发出去的请求体变成 {"history": {}} → 后端校验失败 → 422 错误。
//   （这里静默不报错，最难查。所以凡是 window 已有的名字——history、name、
//     status、length、top、self、parent——都别拿来当自己的变量名。）
var chatHistory = [];

// 请求进行中标志：防止重复点击
var sending = false;


// ---------- 把对话区滚到底部 ----------
// 【为什么滚的是 chatBox，而不是整页】
//   改版后页面本身不滚动了（body 撑满一屏、overflow: hidden），
//   真正能滚的只有 #chat 这一块。
//   所以要把新内容露出来，改的是 chatBox.scrollTop ——
//   原来那句 window.scrollTo(0, document.body.scrollHeight) 已经没效果了
//   （页面根本滚不动），这也是改版时必须一起改的地方。
//   scrollHeight = "内容的总高度"，把它赋给 scrollTop 就等于滚到最底。
function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
}


// ---------- 点快捷按钮时，把问题填进输入框（不自动发送） ----------
function fillQuestion(text) {
    inputBox.value = text;
    inputBox.focus();
}


// ---------- 创建一个空的"智能体回答卡片"，返回里面几个容器 ----------
function createAgentCard() {
    var card = document.createElement("div");
    card.className = "agent-msg";

    var toolBlock = document.createElement("div");
    toolBlock.className = "tool-block";
    toolBlock.style.display = "none";   // 一开始没有工具调用，先藏着

    var thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "正在思考…";

    var answer = document.createElement("div");
    answer.className = "answer";

    var meta = document.createElement("div");
    meta.className = "meta";

    card.appendChild(toolBlock);
    card.appendChild(thinking);
    card.appendChild(answer);
    card.appendChild(meta);
    chatBox.appendChild(card);

    // 新卡片刚加进来，立刻滚到底 —— 否则它在视口外面，用户以为没反应
    scrollToBottom();

    // 【注意】返回的是一个普通对象（JavaScript 里叫对象字面量），
    //   把几个元素打包起来，调用方就能一次拿到全部。
    return {
        toolBlock: toolBlock,
        thinking: thinking,
        answer: answer,
        meta: meta
    };
}


// ---------- 往页面上加一条"用户提问" ----------
function addUserMessage(text) {
    var el = document.createElement("div");
    el.className = "user-msg";
    el.textContent = text;
    chatBox.appendChild(el);
}


// ---------- 解析一条 SSE 报文的文本，取出事件名和数据 ----------
function parseSseMessage(raw) {
    var eventName = "";
    var dataText = "";

    // 一条报文长这样（用换行分了好几行）：
    //   event: delta
    //   data: {"content": "体育类"}
    var lines = raw.split("\n");
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];

        // .indexOf("event: ") === 0 意思是"这行以 event: 开头"
        if (line.indexOf("event: ") === 0) {
            eventName = line.slice(7);       // 去掉开头 7 个字符 "event: "
        } else if (line.indexOf("data: ") === 0) {
            dataText = line.slice(6);        // 去掉开头 6 个字符 "data: "
        }
    }

    if (dataText === "") {
        return null;
    }

    return {
        event: eventName,
        data: JSON.parse(dataText)           // JSON.parse：把 JSON 文本变回对象
    };
}


// ---------- 把文字安全地放进页面（防止 HTML 注入） ----------
// 【为什么需要这个函数】
//   模型返回的文字要显示成"加粗"等效果，就必须用 innerHTML 写进页面。
//   但 innerHTML 是危险的：如果文字里带了 <script> 这类内容，浏览器会真的执行它。
//   （这个风险叫 XSS —— 跨站脚本攻击。哪怕内容来自自己的模型，也该防，
//     因为用户可以把恶意内容塞进数据库，模型再照着念出来。）
//   所以先做转义：把 < > & 换成安全的形式，再动手加样式。
function escapeHtml(text) {
    // String(...) 兜一层：万一传进来的是 undefined / null / 数字，
    // 直接 .replace 会报错崩掉整个渲染。先统一转成字符串最稳。
    var out = String(text === undefined || text === null ? "" : text);
    out = out.replace(/&/g, "&amp;");
    out = out.replace(/</g, "&lt;");
    out = out.replace(/>/g, "&gt;");
    return out;
}


// ---------- 把回答里的 **加粗** 渲染成真正的加粗 ----------
// 【语法说明】replace 第一个参数是"正则表达式"，用来匹配一段文字：
//   /\*\*(.+?)\*\*/g   读作：两个星号 + 任意内容（尽量短）+ 两个星号，全局替换
//   $1 表示"匹配到的括号里的内容"
function renderAnswer(rawText) {
    var safeText = escapeHtml(rawText);
    var rendered = safeText.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return rendered;
}


// ---------- 处理一条已经解析好的事件 ----------
function handleEvent(msg, ui) {
    var data = msg.data;

    // ① 开场：把可用工具显示在顶部
    if (msg.event === "mode") {
        // 【语法说明】data.tools 是个数组，用 for 循环逐个造标签
        if (data.tools) {
            toolTags.innerHTML = "";
            for (var i = 0; i < data.tools.length; i++) {
                var tag = document.createElement("span");
                tag.className = "tool-tag";
                tag.textContent = data.tools[i];
                toolTags.appendChild(tag);
            }
        }
        return;
    }

    // ② 模型决定调工具了
    if (msg.event === "tool_call") {
        ui.toolBlock.style.display = "block";
        var line = document.createElement("div");
        line.className = "tool-line";

        // ⚠️ 这里必须转义（2026-09-19 排查出来的）：
        //    工具名和参数【都来自模型的返回】，不是我们自己写死的常量 ——
        //    而模型会把用户问题里的词原样当参数传下来。
        //    所以用户只要在问题里写一段 <img src=x onerror=...>，
        //    不转义的话这段 HTML 就会被浏览器真的执行（XSS）。
        //    textContent 天然安全，但这里要保留 <span> 的样式，
        //    所以用 innerHTML + escapeHtml 处理数据部分。
        var toolName = data.name || "未知工具";
        var argText = JSON.stringify(data.arguments || {});

        line.innerHTML = "🔧 正在调用 <span class='tool-name'>" + escapeHtml(toolName) +
                         "</span>（参数：" + escapeHtml(argText) + "）";
        ui.toolBlock.appendChild(line);
        scrollToBottom();   // 工具块是逐渐长高的，每加一行都跟着滚
        return;
    }

    // ③ 工具执行完，带着结果
    if (msg.event === "tool_result") {
        var resultText = JSON.stringify(data);

        // 工具返回的数据可能很长（比如一次返回 5 篇新闻的完整信息），
        // 全铺在页面上会把屏幕占满、也看不清重点，所以超过一定长度就截断。
        if (resultText.length > 200) {
            resultText = resultText.slice(0, 200) + "  …（共 " + resultText.length + " 字符）";
        }

        var resLine = document.createElement("div");
        resLine.className = "tool-line tool-result";
        resLine.textContent = "✅ 返回：" + resultText;
        ui.toolBlock.appendChild(resLine);
        scrollToBottom();
        return;
    }

    // ④ 正文的一小段（会来很多次，一段段接起来就是完整回答）
    if (msg.event === "delta") {
        ui.thinking.style.display = "none";            // 已经有字了，把"正在思考"藏掉

        // 先读出已有的纯文本，接上这一段，再整体渲染一次
        // （每次都整体渲染，是为了让 **加粗** 在文字还没收完时也能正确显示）
        var fullText = ui.answer.textContent + (data.content || "");
        ui.answer.innerHTML = renderAnswer(fullText);

        scrollToBottom();   // 跟着往下滚（滚的是对话区，不是整个页面）
        return;
    }

    // ⑤ 收尾：显示耗时和工具调用次数
    if (msg.event === "done") {
        var seconds = (data.latency_ms / 1000).toFixed(1);
        ui.meta.textContent = "耗时 " + seconds + " 秒 · 调用工具 " +
                              data.tool_call_count + " 次 · 共 " +
                              data.answer_length + " 字";
        return;
    }

    // ⑥ 出错
    if (msg.event === "error") {
        ui.thinking.style.display = "none";
        var err = document.createElement("div");
        err.className = "err";
        err.textContent = "出错：" + (data.message || "未知错误");
        ui.toolBlock.appendChild(err);
        return;
    }
}


// ---------- 主流程：发送问题 ----------
// 【语法说明】async function 表示"异步函数"，
//   只有它内部才能用 await（等一件事做完再继续）。
//   这和 Python 的 async / await 是同一个概念，只是写法不同。
async function ask() {
    if (sending) {
        return;
    }

    var question = inputBox.value.trim();
    if (question === "") {
        inputBox.focus();
        return;
    }

    sending = true;
    sendBtn.disabled = true;
    inputBox.value = "";

    addUserMessage(question);
    scrollToBottom();          // 让刚发出去的那个问题立刻露出来
    var ui = createAgentCard();

    try {
        // 【语法说明】fetch 是浏览器内置的"发 HTTP 请求"函数，
        //   相当于 Python 里的 httpx。第二个参数是配置对象。
        var response = await fetch("/api/agent/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                question: question,
                history: chatHistory
            })
        });

        if (!response.ok) {
            // 出错时把服务端返回的详细原因也读出来一起显示，
            // 否则只看到一个 422/500，根本不知道哪一步错了。
            // 【语法说明】response.json() 是"把响应体解析成对象"，
            //   因为要读服务端的响应，所以这里也要 await。
            var detailText = "";
            try {
                var errBody = await response.json();
                detailText = "（" + JSON.stringify(errBody.detail) + "）";
            } catch (readErr) {
                detailText = "";
            }
            throw new Error("服务返回 " + response.status + " " + detailText);
        }

        // 【关键】response.body 是一个"字节流"，要一点点读。
        //   getReader() 拿到读取器；read() 每次读一小块，读到 {done: true} 表示流结束。
        var reader = response.body.getReader();

        // TextDecoder：把读到的字节解码成文字（浏览器内置）
        var decoder = new TextDecoder("utf-8");

        // SSE 的每条消息以"空行"分隔。但网络传输是切块的，
        // 一小块里可能"半条消息"，所以需要一个缓冲区把碎块拼起来。
        var buffer = "";

        while (true) {
            var result = await reader.read();

            if (result.done) {
                break;
            }

            // 【注意】decode 的第二个参数 {stream: true} 表示"后面还有",
            //   这样中文被切成两半时不会解码出错。
            buffer = buffer + decoder.decode(result.value, { stream: true });

            // 按空行切分。split 返回数组，最后一段可能不完整，留着下次再拼
            var parts = buffer.split("\n\n");
            buffer = parts.pop();

            for (var i = 0; i < parts.length; i++) {
                var msg = parseSseMessage(parts[i]);
                if (msg !== null) {
                    handleEvent(msg, ui);
                }
            }
        }

        // 把这一轮问答记进历史，下一轮提问带上去
        chatHistory.push({ role: "user", content: question });
        chatHistory.push({ role: "assistant", content: ui.answer.textContent });

        // 只保留最近 6 条（3 轮），避免历史太长把请求撑大
        if (chatHistory.length > 6) {
            chatHistory = chatHistory.slice(chatHistory.length - 6);
        }

    } catch (error) {
        ui.thinking.style.display = "none";
        var err2 = document.createElement("div");
        err2.className = "err";
        err2.textContent = "请求失败：" + error.message;
        ui.toolBlock.style.display = "block";
        ui.toolBlock.appendChild(err2);
    }

    sending = false;
    sendBtn.disabled = false;
    inputBox.focus();
}


// ---------- 绑定事件 ----------
sendBtn.addEventListener("click", ask);

// 按回车也能发送
inputBox.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        ask();
    }
});

// 窗口大小变了就重新贴到底部
// 【为什么需要】浏览器验证时发现的：把窗口压矮之后，输入框不会跑（它吸底），
//   但对话区里的最新那条消息可能滑出视野 —— 因为对话区的高度变小了，
//   而 scrollTop 没变。这一行保证 resize 之后仍然停在最新消息上。
window.addEventListener("resize", scrollToBottom);
</script>
</body>
</html>
