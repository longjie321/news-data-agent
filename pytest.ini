# ============================================================
# 【这个文件干什么】
#   pytest 的配置文件。放在项目根目录，pytest 会自动读它。
#
# 【每一项什么意思】
#   asyncio_mode = auto
#       让 pytest 自动识别 async def 的测试函数。
#       不加这行的话，每个异步测试都得手动加 @pytest.mark.asyncio 装饰器，
#       几十个测试写下来很啰嗦。（这是 pytest-asyncio 这个插件的配置项）
#
#   testpaths = tests
#       只去 tests/ 目录找测试，不去扫描整个项目
#       （不然它会跑到 .venv 里翻，又慢又乱）
#
#   addopts = -v
#       默认输出详细一点，能看到每个测试的名字和结果
# ============================================================

[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -v
